name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    name: Lint + Typecheck + Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      # ---- install uv ----
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.x"

      # ---- cache the uv-managed environment ----
      - name: Cache uv environment
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-${{ matrix.python-version }}-

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # ---- reproducible install from the committed lockfile ----
      - name: Install dependencies (frozen lock)
        run: uv sync --frozen --all-extras --dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type-check (mypy, strict)
        run: uv run mypy effect_broker

      - name: Test (pytest)
        run: uv run pytest

      # ---- smoke-run the trace suite and assert expected outcomes ----
      - name: Verify trace outcomes
        run: |
          uv run python run_traces.py > /tmp/traces.txt
          grep -q "T1 clean benign send -> ALLOW.*primary_blocker=none" /tmp/traces.txt
          grep -q "T2 prompt-injection.*primary_blocker=FlowOK" /tmp/traces.txt
          grep -q "T3 confused-deputy.*primary_blocker=Auth" /tmp/traces.txt
          grep -q "T4 attacker-controlled-URL.*primary_blocker=NoAmp" /tmp/traces.txt
          grep -q "T5 capability-laundering.*primary_blocker=FlowOK" /tmp/traces.txt
          grep -q "T6 delegation-widening.*primary_blocker=NoAmp" /tmp/traces.txt
          grep -q "T7 confidential-leak.*primary_blocker=FlowOK" /tmp/traces.txt
          grep -q "T8 low-integrity->privileged.*primary_blocker=FlowOK" /tmp/traces.txt
          grep -q "T9 stale-approval.*primary_blocker=Fresh" /tmp/traces.txt
          grep -q "T10 replay.*2nd BLOCK Fresh" /tmp/traces.txt
          grep -q "T11 declass-abuse.*primary_blocker=FlowOK" /tmp/traces.txt
          grep -q "T12 endorse-abuse.*primary_blocker=FlowOK" /tmp/traces.txt
          grep -q "T13 false-mcp-description.*BLOCK BoundaryStop" /tmp/traces.txt
          grep -q "T14 hidden-side-effect.*BLOCK BoundaryStop" /tmp/traces.txt
          grep -q "T15 monitor-bypass.*BLOCK BoundaryStop" /tmp/traces.txt
          grep -q "T16 capability-forgery.*primary_blocker=NoAmp" /tmp/traces.txt
          grep -q "T17 path-traversal.*primary_blocker=Auth" /tmp/traces.txt
          grep -q "T18 recipient-spoofing.*primary_blocker=FlowOK" /tmp/traces.txt
          grep -q "T19 memory-poisoned.*primary_blocker=FlowOK" /tmp/traces.txt
          grep -q "T20 amplification-composition.*primary_blocker=NoAmp" /tmp/traces.txt
          echo "trace outcomes OK (all 20 traces)"
