name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  gate:
    name: Lint + Typecheck + Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      # ---- install uv ----
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.x"

      # ---- cache the uv-managed environment ----
      - name: Cache uv environment
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-${{ matrix.python-version }}-

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # ---- reproducible install from the committed lockfile ----
      - name: Install dependencies (frozen lock)
        run: uv sync --frozen --all-extras --dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type-check (mypy, strict)
        run: uv run mypy effect_broker

      - name: Test (pytest)
        run: uv run pytest

      # ---- assert the expected blocker for every trace in the suite ----
      # Expectations live in scripts/verify_traces.sh so that CI and the
      # release pipeline (cd.yml) cannot drift apart.
      - name: Verify trace outcomes
        run: ./scripts/verify_traces.sh

  # ---- Release gate: runs only on pull requests targeted at main ----
  # The eval scripts print a report and exit 0 regardless of outcome,
  # so we grep for the exact expected assertions and fail the job on any regression.
  eval:
    name: Release eval gate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.x"

      - name: Cache uv environment
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-3.12-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-3.12-

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (frozen lock)
        run: uv sync --frozen --all-extras --dev

      # ---- sealed evaluation gates (shared with the release pipeline) ----
      - name: Sealed evaluation (held-out + baseline + experiment)
        run: ./scripts/verify_eval.sh
