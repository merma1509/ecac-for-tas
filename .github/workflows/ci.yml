name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

# A newer commit on the same ref makes older runs obsolete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Lint + Typecheck + Test
    runs-on: ubuntu-latest
    strategy:
      # One failing Python version must not cancel the other: both are
      # required checks on `main`, and a cancelled job reports as skipped.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      # ---- install uv ----
      # Pinned exactly: setup-uv does not publish a floating `v10` tag, so a
      # major-only reference does not resolve. It also manages the uv cache
      # itself (built-in, keyed on uv.lock via cache-dependency-glob), which is
      # why no separate actions/cache step is needed here.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.11.x"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # ---- reproducible install from the committed lockfile ----
      - name: Install dependencies (frozen lock)
        run: uv sync --frozen --all-extras --dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type-check (mypy, strict)
        run: uv run mypy effect_broker

      - name: Test (pytest)
        run: uv run pytest

      # ---- prove kernel confinement is actually in effect (P5-1) ----
      # The confinement tests skip on hosts without Landlock, which would let a
      # broken syscall sequence pass CI on a kernel that supports it. This step
      # runs the real probe in the runner's own kernel and fails loudly if
      # confinement cannot be established where it demonstrably can be.
      - name: Verify kernel confinement (P5-1)
        run: |
          uv run python - <<'PY'
          import sys
          from effect_broker import executor_subprocess as sub

          abi = sub._kernel_landlock_abi()
          if abi < 1:
              sys.exit(
                  f"FAIL: the CI kernel reports no Landlock support (ABI {abi}). "
                  "P5-1 cannot be verified on this runner; fix the runner rather "
                  "than letting the confinement tests skip."
              )
          if not sub._activate_confinement():
              sys.exit(
                  f"FAIL: kernel Landlock ABI {abi} is available but the executor "
                  "could not confine itself. The syscall sequence is broken."
              )
          print(f"OK: Landlock ABI {abi} active — {sub._get_confinement_status()}")
          PY

      # ---- assert the expected blocker for every trace in the suite ----
      # Expectations live in scripts/verify_traces.sh so that CI and the
      # release pipeline (cd.yml) cannot drift apart.
      - name: Verify trace outcomes
        run: ./scripts/verify_traces.sh

  # ---- Sealed evaluation: held-out + baseline + experiment ----
  # Runs on every event, so the sealed eval cannot silently rot between
  # releases. On `main` it is the required "Release eval gate" check.
  # The eval scripts print a report and exit 0 regardless of outcome, so we
  # grep for the exact expected assertions and fail on any regression.
  eval:
    name: Release eval gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.11.x"

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies (frozen lock)
        run: uv sync --frozen --all-extras --dev

      # ---- sealed evaluation gates (shared with the release pipeline) ----
      - name: Sealed evaluation (held-out + baseline + experiment)
        run: ./scripts/verify_eval.sh

      # ---- regression tripwire on the metrics snapshot ----
      # `tests/data/metrics_baseline.json` is the recorded reference; this diffs
      # a live run against it. The script exits 1 on a correctness regression
      # (defense rate down, false positives/negatives up, annotation burden up)
      # and 2 if the scenario set changed, which makes the diff meaningless.
      #
      # TCB size and latency are printed but advisory — they move on correct
      # changes and on noise, so they are argued in review rather than gated.
      # See _ADVISORY in scripts/metrics_snapshot.py.
      #
      # The baseline lives under tests/data/ because docs/ is gitignored in this
      # repository, and a reference file a fresh checkout cannot see would turn
      # this gate into a no-op.
      - name: Metrics regression gate
        run: |
          uv run python scripts/metrics_snapshot.py --out "${{ runner.temp }}/metrics.json"
          uv run python scripts/metrics_snapshot.py --compare \
            tests/data/metrics_baseline.json "${{ runner.temp }}/metrics.json"
