[project]
name = "effect-broker"
version = "0.1.0"
description = "Effect-Complete Authority Confinement for Tool Agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Niyonshuti Martin" }]
keywords = ["agent-security", "tool-agents", "authority", "information-flow", "capabilities", "mcp"]

dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
    "ruff>=0.6",
    "aiosmtpd>=1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["effect_broker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -W ignore::UserWarning"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["effect_broker"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4"]

[dependency-groups]
dev = [
    "aiosmtpd>=1.4.6",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
]
